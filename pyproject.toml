[project]
name = "tp4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pillow",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = ["jupyter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
